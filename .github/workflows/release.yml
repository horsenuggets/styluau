name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-release
  cancel-in-progress: false

jobs:
  release-metadata:
    name: release-metadata
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      extension_version: ${{ steps.metadata.outputs.extension_version }}
      matrix: ${{ steps.metadata.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate release metadata and contracts
        id: metadata
        run: |
          python -m unittest discover -s .github -p 'test_release.py'
          python .github/release.py metadata --root . --github-output "$GITHUB_OUTPUT"

  build-cli:
    name: build-cli-${{ matrix.artifact }}
    needs: release-metadata
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release-metadata.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}
      - name: Build all syntax features
        env:
          CARGO_TARGET_DIR: output
          CARGO_TARGET: ${{ matrix.target }}
        shell: bash
        run: cargo build --locked --release --all-features --target "$CARGO_TARGET"
      - name: Package executable
        env:
          CARGO_TARGET: ${{ matrix.target }}
          ARTIFACT_NAME: ${{ matrix.artifact }}
        shell: python
        run: |
          import os
          from pathlib import Path
          import zipfile
          binary = "styluau.exe" if os.environ["CARGO_TARGET"].endswith("windows-msvc") else "styluau"
          source = Path("output") / os.environ["CARGO_TARGET"] / "release" / binary
          Path("staging").mkdir()
          with zipfile.ZipFile(Path("staging") / (os.environ["ARTIFACT_NAME"] + ".zip"), "w", zipfile.ZIP_DEFLATED) as archive:
              archive.write(source, binary)
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: staging/*.zip
          if-no-files-found: error

  build-extension:
    name: build-extension
    needs: release-metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - name: Install locked dependencies
        working-directory: stylua-vscode
        run: npm ci
      - name: Package universal extension
        working-directory: stylua-vscode
        env:
          EXTENSION_PUBLISHER: ${{ github.repository_owner }}
          EXTENSION_REPOSITORY: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.release-metadata.outputs.version }}
          STYLUAU_RELEASES_URL: https://api.github.com/repos/${{ github.repository }}/releases
        run: |
          npm pkg set "publisher=$EXTENSION_PUBLISHER" "repository.type=git" \
            "repository.url=https://github.com/$EXTENSION_REPOSITORY.git"
          cp ../LICENSE.md LICENSE.md
          npx --yes @vscode/vsce@3.7.1 package --githubBranch "$RELEASE_VERSION" --out ../styluau.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: styluau-extension
          path: styluau.vsix
          if-no-files-found: error

  publish-release:
    name: publish-release
    needs: [release-metadata, build-cli, build-extension]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Validate, upload, and publish complete GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXTENSION_PUBLISHER: ${{ github.repository_owner }}
        run: |
          python .github/release.py publish --root . --artifacts release-artifacts \
            --publisher "$EXTENSION_PUBLISHER" --repository "$GH_REPO" --commit "$GITHUB_SHA"
